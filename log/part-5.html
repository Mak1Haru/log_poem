  <PRE CLASS="work"><SPAN CLASS="part-5-copy">（五）

<SPAN CLASS="part-5-title">正正好</SPAN>



咀嚼幸福时她是一百零一只飞鸟。把所有日子的底片折成纸鹤，就能留住那时更温柔的霞吗？<SPAN CLASS="part-5-oblique">会用熟透桃子的颜色呼唤我的那一缕。</SPAN>可她太害羞了暗自发誓要将这个秘密永远永远藏起来
和其他大大小小的珍珠一并嵌在舌尖下呼之欲出的忧郁里


咀嚼幸福时她喜欢抿起嘴口红也显得多余
时间会划开她如纸船自在穿行于空气的海
流出比玫瑰花瓣更炙热甜美的<SPAN CLASS="part-5-spinner-word">横竖横竖横</SPAN></SPAN><SPAN CLASS="part-5-spinner" ARIA-HIDDEN="true"></SPAN></PRE>
