从哪一侧看的海都是完整的一半


没有办法把手伸进去而不被最光滑的孤独淹没那么要借什么时间段的影才能让你说出我听见的那片呢？再给我写一封信好吗即使字符串不会游泳也无法飞翔。项链是那个一直未能来到的夏天的预感永远可以更绵长。<SPAN CLASS="part-7-emphasis">我会挽起袖子把它们一颗一颗捞起来系上去吧。</SPAN></PRE>
