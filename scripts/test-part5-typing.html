<!doctype html>
<meta charset="utf-8">
<title>Part 5 typing checkpoints</title>
<style>body{font:14px system-ui;margin:8px} iframe{display:block;border:1px solid #ddd;height:844px}pre{white-space:pre-wrap}</style>
<h1>Part 5 typing checkpoints</h1><pre id="report">Running…</pre><div id="frames"></div>
<script type="module">
const source = await (await fetch('../log/part-5.html')).text();
const poem = new DOMParser().parseFromString(source,'text/html').querySelector('.work').outerHTML;
const css = new URL('../log/style.css?v=mobile-caret-5',location.href).href;
const report = {cases:[], failures:[]};
for (const width of [320,390,430]) {
  const frame = document.createElement('iframe'); frame.style.width=width+'px';
  const loaded = new Promise(resolve=>frame.onload=resolve);
  frame.srcdoc = '<!DOCTYPE HTML PUBLIC "-//IETF//DTD HTML 2.0//EN"><html class="poem-layout-flow"><link rel="stylesheet" href="'+css+'"><body class="part-5">'+poem+'</body></html>';
  document.querySelector('#frames').append(frame); await loaded;
  const doc=frame.contentDocument, win=frame.contentWindow;
  await doc.fonts.ready;
  const work=doc.querySelector('.work'), spinner=doc.querySelector('.part-5-spinner');
  const walker=doc.createTreeWalker(doc.querySelector('.part-5-copy'),NodeFilter.SHOW_TEXT);
  const states=[]; let node;
  while(node=walker.nextNode()) { states.push({node,text:node.data}); node.data=''; }
  const caret=doc.createElement('span');caret.className='typewriter-cursor';
  let changes=0, caretChanges=0, maxHeightRatio=0, count=0, maxHeight=0;
  const checkpoints=[];
  for (const state of states) for (const char of state.text) {
    state.node.appendData(char);state.node.after(caret);count++;
    if (!/\S/u.test(char)) continue;
    const range=doc.createRange();range.setStart(state.node,state.node.length-1);range.setEnd(state.node,state.node.length);
    const end=range.getBoundingClientRect();
    const height=parseFloat(win.getComputedStyle(caret,'::before').height);
    maxHeight=Math.max(maxHeight,height); maxHeightRatio=Math.max(maxHeightRatio,height/end.height);
    if(height>parseFloat(win.getComputedStyle(caret).fontSize)*.92) report.failures.push(`${width}: oversized caret at ${count}`);
    const withCaret=work.getBoundingClientRect().height;
    caret.remove();
    if(Math.abs(work.getBoundingClientRect().height-withCaret)>.1)caretChanges++;
    state.node.after(caret);
    // An inactive spinner must not insert an empty line while a poem is typed.
    const before=work.getBoundingClientRect().height;
    spinner.remove();const without=work.getBoundingClientRect().height;
    work.append(spinner);
    if(Math.abs(before-without)>.1) {changes++; if(checkpoints.length<8)checkpoints.push({tail:state.node.data.slice(-18),before,without});}
  }
  report.cases.push({width,mode:doc.compatMode,characters:count,spinnerLayoutChanges:changes,caretLayoutChanges:caretChanges,maxHeight,maxHeightRatio,checkpoints});
  if(changes)report.failures.push(`${width}: hidden spinner changes the typing layout ${changes} times`);
  if(caretChanges)report.failures.push(`${width}: caret changes the typing layout ${caretChanges} times`);
  caret.remove();
  const restingHeight=work.getBoundingClientRect().height;
  spinner.classList.add('is-active');spinner.textContent='-';
  const activeHeight=work.getBoundingClientRect().height;
  if(Math.abs(activeHeight-restingHeight)>.1)report.failures.push(`${width}: starting spinner adds a line`);
  for(const symbol of ['\\','|','/','-']) {
    spinner.textContent=symbol;
    if(Math.abs(work.getBoundingClientRect().height-activeHeight)>.1)report.failures.push(`${width}: spinner frame changes line height`);
  }
  // Leave the authored paragraph visible so the line breaks can be inspected.
}
document.querySelector('#report').textContent=JSON.stringify(report,null,2);
</script>
